name: Ticket Mada mobile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Align dependencies with Expo SDK 58
        working-directory: apps/mobile
        run: |
          npx expo install --fix
          npx expo-doctor@latest
      - name: Save SDK 58 dependency alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(mobile): align dependencies with Expo SDK 58"
            git push
          fi
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Expo web preview
        run: npm --workspace apps/mobile run export:web
