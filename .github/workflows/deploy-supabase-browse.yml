name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/browse/**"
      - "supabase/functions/catalog/**"
      - "supabase/functions/gemini/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-browse.yml"
  workflow_dispatch:

# Les déploiements doivent rester séquentiels : ne pas interrompre un déploiement en cours.
concurrency:
  group: supabase-edge-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-browse:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy catalogue, browse and Gemini Edge Functions
        run: |
          supabase functions deploy catalog --use-api --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy browse --use-api --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy gemini --use-api --project-ref "$SUPABASE_PROJECT_ID"
